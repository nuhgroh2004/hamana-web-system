<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Permohonan Masuk</title>
<style>
:root{--bg:#fff;--bg2:#f6f8fa;--fg:#1f2328;--mute:#59636e;--bd:#d1d9e0;--hov:#eff2f5;--blue:#0969da;--green:#1f883d;--err:#cf222e;--ok:#1a7f37;--warn:#9a6700;--sticky-top:16px;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#0d1117;--bg2:#151b23;--fg:#f0f6fc;--mute:#9198a1;--bd:#3d444d;--hov:#262c36;--blue:#4493f8;--green:#238636;--err:#ff7b72;--ok:#3fb950;--warn:#d29922;color-scheme:dark}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:13px/1.45 -apple-system,"Segoe UI",Helvetica,Arial,sans-serif}
button,input{font:inherit;color:inherit}
svg.i{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;flex:none}
[hidden]{display:none!important}
/* .pg = container: tata letak mengikuti lebar area konten (bukan lebar layar), jadi aman bila nanti ada sidebar */
.pg{container-type:inline-size;max-width:1400px;margin:0 auto;padding:16px 16px calc(24px + env(safe-area-inset-bottom,0px))}
h1{margin:0;padding:0 0 10px;font-size:22px;font-weight:400;line-height:1.25;border-bottom:1px solid var(--bd)}
.ds{margin:8px 0 12px;color:var(--mute);font-size:13px}
.wrap{display:grid;grid-template-columns:clamp(250px,24cqi,310px) minmax(0,1fr);gap:12px;align-items:start}
.pane{border:1px solid var(--bd);border-radius:6px;background:var(--bg);overflow:hidden}
/* daftar (kiri) */
#lpane{position:sticky;top:var(--sticky-top);display:flex;flex-direction:column;max-height:calc(100dvh - var(--sticky-top) - 16px)}
.lf{display:grid;gap:6px;padding:8px;border-bottom:1px solid var(--bd);background:var(--bg2)}
.r2{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:6px}
.srch{position:relative;min-width:0}
.srch svg{position:absolute;left:10px;top:50%;transform:translateY(-50%);color:var(--mute);pointer-events:none}
.srch .fld{padding-left:32px}
.fld{width:100%;min-height:28px;padding:3px 10px;border:1px solid var(--bd);border-radius:6px;background:var(--bg);outline:0;transition:border-color .15s,box-shadow .15s}
.fld:focus{border-color:var(--blue);box-shadow:0 0 0 1px var(--blue)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:28px;padding:0 10px;border:1px solid var(--bd);border-radius:6px;background:var(--bg);font-size:12.5px;font-weight:600;cursor:pointer;white-space:nowrap;transition:background .15s}
.btn:hover{background:var(--hov)}
.btn.sm{height:24px;padding:0 8px;font-size:12px}
.btn.go{background:var(--green);border-color:var(--green);color:#fff}.btn.go:hover{filter:brightness(1.1);background:var(--green)}
.btn.dg{color:var(--err)}.btn.dg:hover{border-color:var(--err)}
.btn.dgb{background:var(--err);border-color:var(--err);color:#fff}.btn.dgb:hover{filter:brightness(1.1);background:var(--err)}
.btn.dd{width:100%;justify-content:space-between;gap:8px;font-weight:400}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{height:24px;padding:0 8px;border:1px solid var(--bd);border-radius:6px;background:var(--bg);font-size:12px;cursor:pointer;transition:background .15s}
.chip:hover{background:var(--hov)}
.chip em{font-style:normal;margin-left:4px;color:var(--mute)}
.chip.on{background:var(--blue);border-color:var(--blue);color:#fff;font-weight:600}.chip.on em{color:#fff;opacity:.85}
.lst{flex:1;min-height:0;overflow-y:auto;scroll-behavior:smooth}
.it{display:block;width:100%;padding:8px 12px;text-align:left;border:0;border-bottom:1px solid var(--bd);border-left:3px solid transparent;background:transparent;cursor:pointer;transition:background .12s}
.it:last-child{border-bottom:0}
.it:hover{background:var(--bg2)}
.it.on{background:var(--hov);border-left-color:#fd8c73}
.it .t{display:flex;justify-content:space-between;gap:12px}
.it .n{font-weight:600;overflow-wrap:anywhere}
.it .d{flex:none;color:var(--mute);font-size:11px;white-space:nowrap}
.it .j{color:var(--mute);font-size:12px;margin:1px 0 5px}
.it .b{display:flex;gap:6px;flex-wrap:wrap}
.bdg{display:inline-flex;align-items:center;gap:4px;padding:0 7px;border-radius:2em;border:1px solid var(--bd);font-size:11px;font-weight:500;line-height:18px;color:var(--mute);white-space:nowrap}
.bdg.w{color:var(--warn);background:rgba(212,167,44,.15);border-color:rgba(212,167,44,.5)}
.bdg.ok{color:var(--ok);background:rgba(46,160,67,.12);border-color:rgba(46,160,67,.4)}
.bdg.x{color:var(--err);background:rgba(248,81,73,.12);border-color:rgba(248,81,73,.4)}
.bdg.g{color:var(--fg);background:var(--hov)}
.bdg svg{width:12px;height:12px;stroke-width:2.2}
.none{padding:32px 16px;text-align:center;color:var(--mute)}
/* detail (kanan) */
#dpane{padding:14px}
.back{display:none;margin:0 0 12px}
.dh{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:10px}
.dh h2{margin:0;font-size:18px;font-weight:600;line-height:1.3;overflow-wrap:anywhere}
.dh p{margin:2px 0 0;color:var(--mute)}
.ac{display:flex;gap:8px;flex-wrap:wrap}
.info{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:8px;margin-bottom:10px}
.box{border:1px solid var(--bd);border-radius:6px;background:var(--bg2);padding:8px 12px}
.box h3{display:flex;align-items:center;gap:8px;margin:0;font-size:13px;font-weight:600}
.box h3.u{font-size:12px;letter-spacing:.04em;text-transform:uppercase;color:var(--mute);margin-bottom:6px}
.box .em{margin:6px 0 0;color:var(--mute);font-style:italic}
.fl2{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.fch{display:inline-flex;align-items:center;gap:6px;padding:2px 10px;border:1px solid var(--bd);border-radius:6px;background:var(--bg);font-size:12.5px}
.sgr{display:flex;align-items:center;gap:8px 10px;padding:6px 0;flex-wrap:wrap}
.sgr .nm{font-weight:600}.sgr .rl{color:var(--mute);font-size:12.5px}
.sgr .stt{margin-left:auto;font-size:12.5px;color:var(--mute)}
.sgr .stt.ok{color:var(--ok)}.sgr .stt.x{color:var(--err)}
.sgr .tx{display:contents}
.sgr .ic{display:grid;place-items:center;width:20px;height:20px;border-radius:50%;background:var(--hov);color:var(--mute);flex:none}
.sgr .ic.ok{background:var(--ok);color:#fff}.sgr .ic svg{width:12px;height:12px;stroke-width:2.4}
/* kanvas surat: kertas A4 (794 x 1123 px) diskalakan otomatis agar selalu utuh sesuai lebar tersedia */
.cv{padding:10px;border:1px solid var(--bd);border-radius:6px;background:var(--bg2)}
.fit{margin:0 auto}
.paper{width:794px;min-height:1123px;padding:72px 64px;transform-origin:0 0;background:#fff;color:#111;box-shadow:0 1px 3px rgba(31,35,40,.18),0 8px 24px rgba(31,35,40,.08);font:15px/1.65 Arial,Helvetica,sans-serif}
.paper svg.lg{display:block;width:120px;height:48px;color:#004098;margin-bottom:18px}
.paper h4{margin:20px 0 20px;text-align:center;font-size:18px;text-decoration:underline}
.paper p{margin:0 0 20px}
.fl{display:grid;grid-template-columns:170px 12px minmax(0,1fr);gap:0 6px;align-items:end;margin:12px 0}
.fl>span:first-child{white-space:nowrap}
.fl .v{min-height:26px;border-bottom:1px solid #111;overflow-wrap:anywhere}
.fl .v2{display:flex;gap:12px;align-items:flex-end}.fl .v2 span{flex:1;min-height:26px;border-bottom:1px solid #111}
.sg{margin-top:56px;display:flex;justify-content:flex-end}
.sg div{min-width:230px;text-align:center}
.sg .sp{height:72px;display:grid;place-items:center;color:#1a7f37;font-size:13px}
.sg b{text-decoration:underline}
.sg small{display:block;color:#555}
/* kertas ringkas (layar sempit): lebar logis lebih kecil + padding kecil -> skala lebih besar, teks terbaca */
.paper.cp{padding:40px 34px;font-size:14px;line-height:1.55}
.paper.cp svg.lg{width:96px;height:38px;margin-bottom:12px}
.paper.cp h4{font-size:16px;margin:14px 0}
.paper.cp p{margin:0 0 14px}
.paper.cp .fl{grid-template-columns:122px 10px minmax(0,1fr);gap:0 4px;margin:10px 0}
.paper.cp .sg{margin-top:36px}
.paper.cp .sg div{min-width:190px}
/* popover / modal */
.mn{position:fixed;z-index:70;padding:4px;background:var(--bg);border:1px solid var(--bd);border-radius:12px;box-shadow:0 8px 24px rgba(31,35,40,.2);animation:pop .12s ease-out;max-height:min(360px,calc(100dvh - 16px));overflow-y:auto}
@keyframes pop{from{opacity:0;transform:translateY(-4px) scale(.98)}to{opacity:1;transform:none}}
.mn button{display:flex;align-items:center;gap:10px;width:100%;padding:8px 12px;border:0;border-radius:8px;background:transparent;color:var(--fg);text-align:left;cursor:pointer}
.mn button:hover{background:var(--hov)}
.mn button .ck{margin-left:auto;color:var(--blue);visibility:hidden}
.mn button.on{font-weight:600}.mn button.on .ck{visibility:visible}
.ov2{position:fixed;inset:0;z-index:50;display:flex;align-items:center;justify-content:center;padding:20px;background:rgba(1,4,9,.6)}
.dlg{width:100%;max-width:1100px;height:calc(100dvh - 40px);display:flex;flex-direction:column;background:var(--bg);border:1px solid var(--bd);border-radius:12px;overflow:hidden;box-shadow:0 16px 48px rgba(0,0,0,.4)}
.dlh{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 16px;border-bottom:1px solid var(--bd);background:var(--bg2);font-weight:600}
.dlh>span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.zc{display:flex;align-items:center;gap:4px;flex:none}
.zc .zp{min-width:48px;text-align:center;font-weight:400;color:var(--mute);font-size:12.5px}
.x{display:grid;place-items:center;min-width:28px;height:28px;padding:0 6px;border:0;border-radius:6px;background:transparent;cursor:pointer;color:var(--fg);font-weight:600}.x:hover{background:var(--hov)}
.dlb{flex:1;min-height:0;overflow:auto;padding:20px;background:var(--bg2)}
.dlg.sm{max-width:440px;height:auto;max-height:calc(100dvh - 40px)}
.dsb{padding:14px 16px;display:grid;gap:8px;overflow:auto}
.dsb p{margin:0;color:var(--mute)}.dsb label{font-weight:600}.dsb .opt{font-weight:400;color:var(--mute)}
.dlf{display:flex;justify-content:flex-end;gap:8px;padding:10px 16px;border-top:1px solid var(--bd)}
textarea.fld{resize:vertical;min-height:84px;font:inherit}
.alsn{margin:6px 0 0;padding-top:6px;border-top:1px dashed var(--bd);color:var(--mute);font-size:12.5px;overflow-wrap:anywhere}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);padding:10px 16px;border-radius:6px;background:var(--fg);color:var(--bg);opacity:0;pointer-events:none;transition:opacity .25s,transform .25s;z-index:80}
.toast.on{opacity:1;transform:translate(-50%,0)}
#pa{display:none}
/* ---- responsif berdasarkan lebar area konten ---- */
@container (max-width:959px){
  .wrap{display:block}
  #lpane{position:static;max-height:none}
  .lst{overflow:visible}
  #dpane{display:none}
  .wrap.show-detail #lpane{display:none}
  .wrap.show-detail #dpane{display:block}
  .back{display:inline-flex}
}
@container (max-width:560px){
  h1{font-size:20px}
  #dpane{padding:10px}
  .cv{padding:0;border:0;background:transparent}
  .dh{display:block}
  .dh h2{font-size:16px}
  .ac{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
  .ac .btn{height:36px;font-size:13px;width:100%}
  .box{padding:10px 12px}
  .sgr{flex-wrap:nowrap;align-items:flex-start;padding:8px 0}
  .sgr+.sgr{border-top:1px solid var(--bd)}
  .sgr .ic{margin-top:1px}
  .sgr .tx{display:block;flex:1;min-width:0}
  .sgr .nm,.sgr .rl,.sgr .stt{display:block;margin:0}
  .sgr .rl{margin-top:1px}
  .sgr .stt{margin-top:3px;font-weight:500}
  .it{padding:10px 12px}
  .chip{height:28px;padding:0 10px}
}
@media (max-width:700px){.fld{font-size:16px;min-height:36px}.btn.dd{height:36px}.dlf .btn{height:36px}.pg{padding:12px 12px calc(24px + env(safe-area-inset-bottom,0px))}.ov2{padding:8px}.dlg{height:calc(100dvh - 16px);border-radius:8px}.dlb{padding:10px}}
@media print{
  @page{size:A4;margin:15mm}
  body.printing>*:not(#pa){display:none!important}
  body.printing #pa{display:block}
  body.printing .paper{width:auto;min-height:0;padding:0;box-shadow:none;transform:none}
}
</style>
</head>
<body>
<!-- Halaman Permohonan Masuk tanpa sidebar/navbar. Pasang di dalam layout sistem Anda.
     Tata letak mengikuti lebar area konten, jadi tetap nyaman saat ada sidebar.
     Bila ada navbar tetap di atas, atur --sticky-top (tinggi navbar + jarak) agar daftar tidak tertutup.
     Event: "permohonan-pilih", "permohonan-pdf", "permohonan-setuju" (detail = permohonan),
     "permohonan-tolak" (detail = {permohonan, alasan}; alasan boleh null).
     Data ada pada array REQ di script; ganti dengan data dari server. -->
<div class="pg">
  <h1>Permohonan Masuk</h1>
  <p class="ds">Daftar permohonan yang masuk untuk ditinjau</p>

  <div class="wrap" id="wrap">
    <section class="pane" id="lpane" aria-label="Daftar permohonan">
      <div class="lf">
        <label class="srch"><svg class="i" viewBox="0 0 16 16"><circle cx="7" cy="7" r="4.5"/><path d="M10.5 10.5L14 14"/></svg><input class="fld" id="q" type="search" placeholder="Cari nama..." autocomplete="off" aria-label="Cari nama"></label>
        <div class="r2">
          <button type="button" class="btn dd" data-dd="mon" aria-haspopup="listbox"><b class="l" style="font-weight:400"></b><svg class="i" viewBox="0 0 16 16"><path d="M4 6l4 4 4-4"/></svg></button>
          <button type="button" class="btn dd" data-dd="yr" aria-haspopup="listbox"><b class="l" style="font-weight:400"></b><svg class="i" viewBox="0 0 16 16"><path d="M4 6l4 4 4-4"/></svg></button>
        </div>
        <div class="chips" id="chips"></div>
      </div>
      <div class="lst" id="lst"></div>
    </section>

    <section class="pane" id="dpane" aria-label="Detail permohonan"></section>
  </div>
</div>

<div class="mn" id="mn" role="listbox" hidden></div>
<div class="ov2" id="ov" hidden></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<div id="pa" aria-hidden="true"></div>

<script>
(function(){
  var BL=["Jan","Feb","Mar","Apr","Mei","Jun","Jul","Agu","Sep","Okt","Nov","Des"];
  var BF=["Januari","Februari","Maret","April","Mei","Juni","Juli","Agustus","September","Oktober","November","Desember"];
  var ST={menunggu:["Menunggu","w"],disetujui:["Disetujui","ok"],ditolak:["Ditolak","x"],batal:["Dibatalkan Pemohon","g"]};
  var SIGNER={nama:"ERWIN SUNUNTO",peran:"Atasan Langsung (Pemberi Izin)"};
  var A4W=794,CPW=500;
  // Data contoh (ganti dengan data dari server)
  var REQ=[
    {id:"1",nama:"M. ALI AGUNG MULYANA ADI SAPUTRA",jabatan:"Operator",jenis:"Izin Keluar Kantor",tgl:"2026-11-13",status:"menunggu",files:[],jam:["09:30","11:00"],ket:"Keperluan pribadi"},
    {id:"2",nama:"Tryas Prayoga Diantoro",jabatan:"Maintenance Officer",jenis:"Izin Keluar Kantor",tgl:"2026-11-13",status:"disetujui",files:[],jam:["13:06","15:15"],ket:"Keperluan pribadi"},
    {id:"3",nama:"Nuhgroh Ramadani",jabatan:"Officer IT",jenis:"Izin Keluar Kantor",tgl:"2026-11-13",status:"batal",files:["lampiran-1.jpg","lampiran-2.jpg","lampiran-3.pdf"],jam:["10:00","12:00"],ket:"Keperluan pribadi"},
    {id:"4",nama:"Kharisma Quintya Bilqis",jabatan:"Officer",jenis:"Form Pengajuan Absensi",tgl:"2026-11-13",status:"disetujui",files:[],jam:["",""],ket:"Lupa melakukan absensi"},
    {id:"5",nama:"DODDY AL FIQRI RUSDIANSYAH",jabatan:"Operator",jenis:"Izin Keluar Kantor",tgl:"2026-11-13",status:"ditolak",files:[],jam:["14:00","16:00"],ket:"Keperluan pribadi"}
  ];

  var q="",stf="all",mon="all",yr="2026",sel="2";
  var lst=document.getElementById("lst"),dp=document.getElementById("dpane"),wrap=document.getElementById("wrap"),mn=document.getElementById("mn"),ov=document.getElementById("ov");
  function esc(v){return String(v==null?"":v).replace(/&/g,"&amp;").replace(/"/g,"&quot;").replace(/</g,"&lt;")}
  function emit(n,d){document.dispatchEvent(new CustomEvent(n,{detail:d}))}
  function D(r){var p=r.tgl.split("-");return new Date(+p[0],+p[1]-1,+p[2])}
  function dshort(r){var d=D(r);return d.getDate()+" "+BL[d.getMonth()]+" "+d.getFullYear()}
  function dlong(r){var d=D(r);return d.getDate()+" "+BF[d.getMonth()]+" "+d.getFullYear()}
  function hari(r){return D(r).toLocaleDateString("id-ID",{weekday:"long"})}
  function base(){
    var s=q.trim().toLowerCase();
    return REQ.filter(function(r){
      var d=D(r);
      return String(d.getFullYear())===yr&&(mon==="all"||String(d.getMonth())===mon)&&(!s||r.nama.toLowerCase().indexOf(s)>=0);
    });
  }
  function cur(){return REQ.filter(function(r){return r.id===sel})[0]}

  // ---- dropdown kustom ----
  var DD={},CK='<svg class="i ck" viewBox="0 0 16 16"><path d="M3 8.5l3.5 3.5L13 4.5"/></svg>',curBtn=null,curDD=null;
  function paint(id){var d=DD[id],o=d.opts.filter(function(x){return x[0]===d.val})[0];document.querySelectorAll('[data-dd="'+id+'"] .l').forEach(function(el){el.textContent=o?o[1]:""})}
  function closeMenu(){mn.hidden=true;curBtn=null;curDD=null}
  function openDD(btn){
    var id=btn.dataset.dd,d=DD[id];
    mn.innerHTML=d.opts.map(function(o){return '<button type="button" role="option" data-opt="'+esc(o[0])+'" class="'+(o[0]===d.val?'on':'')+'">'+esc(o[1])+CK+'</button>'}).join("");
    var w=Math.max(btn.offsetWidth,170);mn.style.width=w+"px";mn.hidden=false;
    var r=btn.getBoundingClientRect(),h=mn.offsetHeight,top=r.bottom+4;
    if(top+h>innerHeight-8)top=Math.max(8,r.top-h-4);
    mn.style.top=top+"px";mn.style.left=Math.max(8,Math.min(innerWidth-w-8,r.left))+"px";
    curBtn=btn;curDD=id;
  }
  document.addEventListener("click",function(e){
    var b=e.target.closest("[data-dd]");
    if(b){if(curBtn===b){closeMenu();return}closeMenu();openDD(b);return}
    if(!mn.hidden&&!mn.contains(e.target))closeMenu();
  });
  mn.addEventListener("click",function(e){
    var o=e.target.closest("[data-opt]");
    if(o&&curDD){var id=curDD,d=DD[id];d.val=o.dataset.opt;paint(id);closeMenu();d.cb(d.val)}
  });
  window.addEventListener("scroll",function(e){if(!mn.hidden&&!mn.contains(e.target))closeMenu()},true);
  window.addEventListener("resize",closeMenu);

  // ---- surat (A4) ----
  var LOGO='<svg class="lg" viewBox="0 0 140 56" role="img" aria-label="Hamana Works"><ellipse cx="70" cy="28" rx="66" ry="24" fill="none" stroke="currentColor" stroke-width="2.4"/><g fill="currentColor" font-family="\'Arial Black\',\'Helvetica Neue\',Arial,sans-serif" font-weight="900" font-style="italic" font-size="19"><text x="24" y="30" textLength="92" lengthAdjust="spacingAndGlyphs">HAMANA</text><text x="36" y="46" textLength="76" lengthAdjust="spacingAndGlyphs">WORKS</text></g></svg>';
  function fr(l,v){return '<div class="fl"><span>'+l+'</span><span>:</span><div class="v">'+esc(v)+'</div></div>'}
  function paper(r){
    var keluar=r.jenis==="Izin Keluar Kantor";
    var h=LOGO+'<h4>'+(keluar?'SURAT IZIN KELUAR KANTOR':'FORM PENGAJUAN ABSENSI')+'</h4>'+
      '<p>'+(keluar?'Yang bertanda tangan di bawah ini, dengan ini memberikan izin kepada tersebut karyawan yang namanya tertera di bawah ini untuk izin keluar kantor pada jam kerja:':'Yang bertanda tangan di bawah ini, dengan ini menyetujui pengajuan absensi karyawan yang namanya tertera di bawah ini:')+'</p>'+
      fr("Nama Karyawan",r.nama)+fr("Jabatan",r.jabatan)+fr("Hari/Tanggal",hari(r)+", "+dlong(r));
    if(keluar)h+='<div class="fl"><span>Jam Keluar /Masuk</span><span>:</span><div class="v2"><span>'+esc(r.jam[0])+'</span><i>/</i><span>'+esc(r.jam[1])+'</span></div></div>';
    h+=fr(keluar?"Tujuan":"Keterangan",r.ket)+
      '<div class="sg"><div><small>Pemberi Izin,</small><div class="sp">'+(r.status==="disetujui"?'✓ Ditandatangani':'')+'</div><b>'+SIGNER.nama+'</b></div></div>';
    return '<div class="paper">'+h+'</div>';
  }
  // skala kertas A4 agar selalu utuh sesuai lebar tersedia (host = elemen pembungkus yang punya padding)
  function fit(host,zoom,cap){
    var f=host.querySelector(".fit"),p=f&&f.firstElementChild;if(!p)return 1;
    var cs=getComputedStyle(host),avail=host.clientWidth-parseFloat(cs.paddingLeft)-parseFloat(cs.paddingRight);
    var cp=avail<640,pw=cp?CPW:A4W;
    p.classList.toggle("cp",cp);
    p.style.width=pw+"px";p.style.minHeight=Math.round(pw*1.4142)+"px";
    var s=zoom||Math.min(cap||1,Math.max(.3,avail/pw));
    p.style.transform="scale("+s+")";
    f.style.width=(pw*s)+"px";f.style.height=(p.offsetHeight*s)+"px";
    return s;
  }
  // hanya bereaksi pada perubahan LEBAR dan ditunda ke frame berikutnya (menghindari "ResizeObserver loop")
  var ro=null,raf=0,lw=-1;
  function watch(host,fn){
    if(ro)ro.disconnect();
    lw=-1;
    if(!window.ResizeObserver)return;
    ro=new ResizeObserver(function(){
      var w=host.clientWidth;if(w===lw)return;lw=w;
      cancelAnimationFrame(raf);raf=requestAnimationFrame(fn);
    });
    ro.observe(host);
  }

  // ---- render ----
  function chips(){
    var b=base(),c={all:b.length,menunggu:0,disetujui:0,ditolak:0};
    b.forEach(function(r){if(c[r.status]!=null)c[r.status]++});
    document.getElementById("chips").innerHTML=[["all","Semua"],["menunggu","Menunggu"],["disetujui","Disetujui"],["ditolak","Ditolak"]].map(function(x){
      return '<button type="button" class="chip'+(stf===x[0]?' on':'')+'" data-st="'+x[0]+'">'+x[1]+'<em>'+c[x[0]]+'</em></button>';
    }).join("");
  }
  var CHK='<svg class="i" viewBox="0 0 16 16"><path d="M3 8.5l3.5 3.5L13 4.5"/></svg>';
  function renderList(){
    var L=base().filter(function(r){return stf==="all"||r.status===stf});
    if(L.length&&!L.some(function(r){return r.id===sel}))sel=L[0].id;
    if(!L.length)sel=null;
    lst.innerHTML=L.length?L.map(function(r){
      var s=ST[r.status];
      return '<button type="button" class="it'+(r.id===sel?' on':'')+'" data-id="'+r.id+'"><div class="t"><span class="n">'+esc(r.nama)+'</span><span class="d">'+dshort(r)+'</span></div>'+
        '<div class="j">'+esc(r.jenis)+'</div><div class="b">'+(r.files.length?'<span class="bdg ok">'+CHK+'Lampiran: '+r.files.length+' berkas</span>':'')+'<span class="bdg '+s[1]+'">'+s[0]+'</span></div></button>';
    }).join(""):'<div class="none">Tidak ada permohonan yang cocok.</div>';
  }
  var PIC='<svg class="i" viewBox="0 0 16 16"><path d="M13 7.5l-5 5a3.2 3.2 0 01-4.5-4.5l5.5-5.5a2.1 2.1 0 013 3L6.5 11a1 1 0 01-1.5-1.5L10 4.5"/></svg>';
  function renderDetail(){
    var r=cur();
    if(!r){dp.innerHTML='<button type="button" class="btn back" id="back">← Kembali</button><div class="none">Pilih permohonan untuk melihat detail.</div>';if(ro)ro.disconnect();return}
    var sg;
    if(r.status==="disetujui")sg=['Sudah tanda tangan','ok','ok'];
    else if(r.status==="ditolak")sg=['Menolak','x',''];
    else if(r.status==="batal")sg=['Dibatalkan pemohon','',''];
    else sg=['Menunggu tanda tangan','',''];
    dp.innerHTML='<button type="button" class="btn back" id="back">← Kembali</button>'+
      '<div class="dh"><div><h2>'+esc(r.nama)+'</h2><p>'+esc(r.jabatan)+' — '+esc(r.jenis)+' — Diajukan '+dlong(r)+'</p></div>'+
      '<div class="ac">'+(r.status==="menunggu"?'<button type="button" class="btn dg" id="tolak"><svg class="i" viewBox="0 0 16 16"><path d="M4 4l8 8M12 4l-8 8"/></svg>Tolak</button><button type="button" class="btn go" id="setuju"><svg class="i" viewBox="0 0 16 16"><path d="M3 8.5l3.5 3.5L13 4.5"/></svg>Setujui</button>':'')+'<button type="button" class="btn" id="full"><svg class="i" viewBox="0 0 16 16"><path d="M2 6V2h4M10 2h4v4M14 10v4h-4M6 14H2v-4"/></svg>Full</button>'+
      '<button type="button" class="btn" id="pdf"><svg class="i" viewBox="0 0 16 16"><path d="M3.5 1.5h6l3 3v10h-9zM9.5 1.5v3h3M5.5 8h5M5.5 11h5"/></svg>Download PDF</button></div></div>'+
      '<div class="info"><div class="box"><h3>'+PIC+'Lampiran <span class="bdg">'+(r.files.length?r.files.length+' berkas':'Belum ada')+'</span></h3>'+
      (r.files.length?'<div class="fl2">'+r.files.map(function(n){return '<span class="fch">'+PIC+esc(n)+'</span>'}).join("")+'</div>':'<p class="em">Tidak ada lampiran.</p>')+'</div>'+
      '<div class="box"><h3 class="u">Penandatanganan</h3>'+
      '<div class="sgr"><span class="ic '+sg[2]+'">'+(sg[2]==='ok'?CHK:'')+'</span><div class="tx"><span class="nm">'+SIGNER.nama+'</span><span class="rl">'+SIGNER.peran+'</span><span class="stt '+sg[1]+'">'+sg[0]+'</span></div></div>'+
      '<div class="sgr"><span class="ic"><svg class="i" viewBox="0 0 16 16"><rect x="3" y="2" width="10" height="12" rx="1"/><path d="M6 5h4M6 8h4M6 11h4"/></svg></span><div class="tx"><span class="nm">Salinan Departemen HRD</span><span class="stt">Selalu menerima</span></div></div>'+(r.status==="ditolak"&&r.alasan?'<p class="alsn"><b>Alasan penolakan:</b> '+esc(r.alasan)+'</p>':'')+'</div></div>'+
      '<div class="cv" id="cv"><div class="fit">'+paper(r)+'</div></div>';
    var cv=document.getElementById("cv");
    fit(cv,null,.8);watch(cv,function(){fit(cv,null,.8)});
  }
  function render(){chips();renderList();renderDetail()}

  // ---- setujui & tolak ----
  var toast=document.getElementById("toast"),rejT=null;
  function say(m){toast.textContent=m;toast.classList.add("on");clearTimeout(say.t);say.t=setTimeout(function(){toast.classList.remove("on")},2600)}
  function approve(r){
    r.status="disetujui";r.alasan=null;render();
    emit("permohonan-setuju",r);say("Permohonan disetujui.");
  }
  function openReject(r){
    rejT=r;
    ov.innerHTML='<div class="dlg sm" role="dialog" aria-modal="true" aria-label="Tolak permohonan"><div class="dlh"><span>Tolak Permohonan</span><button type="button" class="x" data-close aria-label="Tutup"><svg class="i" viewBox="0 0 16 16"><path d="M4 4l8 8M12 4l-8 8"/></svg></button></div>'+
      '<div class="dsb"><p>Anda akan menolak permohonan <b style="color:var(--fg)">'+esc(r.nama)+'</b> ('+esc(r.jenis)+').</p>'+
      '<label for="rj-t">Alasan penolakan <span class="opt">(opsional)</span></label>'+
      '<textarea class="fld" id="rj-t" rows="4" maxlength="500" placeholder="Tulis alasan penolakan (boleh dikosongkan)"></textarea></div>'+
      '<div class="dlf"><button type="button" class="btn" data-close>Batal</button><button type="button" class="btn dgb" id="rj-ok">Tolak</button></div></div>';
    ov.hidden=false;document.body.style.overflow="hidden";
    document.getElementById("rj-t").focus();
  }
  function doReject(){
    var r=rejT,t=document.getElementById("rj-t").value.trim();
    if(!r)return;
    r.status="ditolak";r.alasan=t||null;rejT=null;
    close();render();
    emit("permohonan-tolak",{permohonan:r,alasan:r.alasan});say("Permohonan ditolak.");
  }

  // ---- aksi ----
  lst.addEventListener("click",function(e){
    var b=e.target.closest("[data-id]");if(!b)return;
    sel=b.dataset.id;renderList();renderDetail();wrap.classList.add("show-detail");
    window.scrollTo({top:0});emit("permohonan-pilih",cur());
  });
  document.getElementById("chips").addEventListener("click",function(e){
    var b=e.target.closest("[data-st]");if(!b)return;stf=b.dataset.st;render();
  });
  document.getElementById("q").addEventListener("input",function(){q=this.value;render()});

  // tampilan penuh dengan zoom
  var zoom=null,lastS=1;
  function openFull(r){
    zoom=null;
    ov.innerHTML='<div class="dlg" role="dialog" aria-modal="true" aria-label="Surat"><div class="dlh"><span>'+esc(r.jenis)+' — '+esc(r.nama)+'</span>'+
      '<div class="zc"><button type="button" class="x" data-z="-" aria-label="Perkecil">−</button><span class="zp" id="zp">100%</span><button type="button" class="x" data-z="+" aria-label="Perbesar">+</button><button type="button" class="btn sm" data-z="fit">Fit</button>'+
      '<button type="button" class="x" data-close aria-label="Tutup"><svg class="i" viewBox="0 0 16 16"><path d="M4 4l8 8M12 4l-8 8"/></svg></button></div></div>'+
      '<div class="dlb" id="dlb"><div class="fit">'+paper(r)+'</div></div></div>';
    ov.hidden=false;document.body.style.overflow="hidden";
    var b=document.getElementById("dlb");
    function upd(){lastS=fit(b,zoom);document.getElementById("zp").textContent=Math.round(lastS*100)+"%"}
    upd();watch(b,upd);ov._upd=upd;
  }
  function close(){ov.hidden=true;ov.innerHTML="";document.body.style.overflow="";ov._upd=null;var cv=document.getElementById("cv");if(cv)watch(cv,function(){fit(cv,null,.8)})}
  ov.addEventListener("click",function(e){
    if(e.target===ov||e.target.closest("[data-close]")){close();return}
    if(e.target.closest("#rj-ok")){doReject();return}
    var z=e.target.closest("[data-z]");if(!z)return;
    var v=z.dataset.z;
    if(v==="fit")zoom=null;else zoom=Math.min(2,Math.max(.3,Math.round((lastS+(v==="+"?.1:-.1))*10)/10));
    ov._upd&&ov._upd();
  });
  document.addEventListener("keydown",function(e){if(e.key!=="Escape")return;if(!mn.hidden)closeMenu();else if(!ov.hidden)close()});

  dp.addEventListener("click",function(e){
    var r=cur();
    if(e.target.closest("#back")){wrap.classList.remove("show-detail");window.scrollTo({top:0});return}
    if(!r)return;
    if(e.target.closest("#setuju")){approve(r);return}
    if(e.target.closest("#tolak")){openReject(r);return}
    if(e.target.closest("#full"))openFull(r);
    else if(e.target.closest("#pdf")){
      var pa=document.getElementById("pa"),t=document.title;
      pa.innerHTML=paper(r);document.title=r.jenis+" - "+r.nama;document.body.classList.add("printing");
      emit("permohonan-pdf",r);
      setTimeout(function(){window.print();document.body.classList.remove("printing");pa.innerHTML="";document.title=t},50);
    }
  });

  // ---- filter bulan & tahun ----
  DD.mon={opts:[["all","Semua Bulan"]].concat(BF.map(function(m,i){return [String(i),m]})),val:"all",cb:function(v){mon=v;render()}};
  DD.yr={opts:["2026","2025","2024"].map(function(y){return [y,y]}),val:yr,cb:function(v){yr=v;render()}};
  paint("mon");paint("yr");
  render();
})();
</script>
</body>
</html>
