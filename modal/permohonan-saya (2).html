<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Permohonan Saya</title>
<style>
:root{--bg:#fff;--bg2:#f6f8fa;--fg:#1f2328;--mute:#59636e;--bd:#d1d9e0;--hov:#eff2f5;--blue:#0969da;--green:#1f883d;--err:#cf222e;--ok:#1a7f37;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#0d1117;--bg2:#151b23;--fg:#f0f6fc;--mute:#9198a1;--bd:#3d444d;--hov:#262c36;--blue:#4493f8;--green:#238636;--err:#ff7b72;--ok:#3fb950;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.5 -apple-system,"Segoe UI",Helvetica,Arial,sans-serif}
button{font:inherit;color:inherit}
.pg{max-width:720px;margin:0 auto;padding:24px 20px 48px}
h1{margin:0 0 4px;padding:0 0 12px;font-size:28px;font-weight:400;line-height:1.25;border-bottom:1px solid var(--bd)}
.ds{margin:12px 0 16px;color:var(--mute)}
.row{display:flex;gap:8px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:34px;min-width:84px;padding:0 16px;border:1px solid var(--bd);border-radius:6px;background:var(--bg2);font-weight:600;cursor:pointer;white-space:nowrap;transition:background .15s,filter .15s,transform .1s}
.btn:hover{background:var(--hov)}.btn:active{transform:scale(.97)}
.btn:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.btn.go{background:var(--green);border-color:var(--green);color:#fff}.btn.go:hover{filter:brightness(1.1);background:var(--green)}
.btn.dgb{background:var(--err);border-color:var(--err);color:#fff}.btn.dgb:hover{filter:brightness(1.1);background:var(--err)}

svg.i{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;flex:none}
[hidden]{display:none!important}
input,textarea{font:inherit;color:inherit}
.fld{width:100%;padding:8px 12px;border:1px solid var(--bd);border-radius:6px;background:var(--bg);outline:0;transition:border-color .15s,box-shadow .15s}
.fld:focus{border-color:var(--blue);box-shadow:0 0 0 1px var(--blue)}
.fld.bad{border-color:var(--err);box-shadow:0 0 0 1px var(--err)}
.er{margin:6px 0 0;color:var(--err);font-size:12.5px}.er:empty{display:none}
.hint{margin:0 0 8px;color:var(--mute);font-size:12.5px}
.md-ov{position:fixed;inset:0;z-index:60;display:flex;align-items:center;justify-content:center;padding:20px;background:rgba(1,4,9,.6);animation:fade .2s ease-out both}
.md{width:100%;max-width:560px;max-height:calc(100dvh - 40px);display:flex;flex-direction:column;background:var(--bg);border:1px solid var(--bd);border-radius:12px;overflow:hidden;box-shadow:0 16px 48px rgba(0,0,0,.4);animation:pop .3s cubic-bezier(.22,1,.36,1) both}
.mh{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 16px;border-bottom:1px solid var(--bd);background:var(--bg2);font-weight:600}
.mx{display:grid;place-items:center;width:28px;height:28px;border:0;border-radius:6px;background:transparent;cursor:pointer;color:var(--mute)}.mx:hover{background:var(--hov)}
.mb{padding:16px;overflow:auto}
.mf{display:flex;justify-content:flex-end;gap:8px;padding:12px 16px;border-top:1px solid var(--bd)}
.pg{padding-bottom:calc(48px + env(safe-area-inset-bottom,0px))}
.pg{max-width:1200px}
:root{--warn:#9a6700;--accent:#fd8c73}
@media (prefers-color-scheme:dark){:root{--warn:#d29922}}
.btn.sm{height:28px;min-width:0;padding:0 10px;font-size:12.5px}
.btn.dg{color:var(--err)}.btn.dg:hover{background:var(--err);border-color:var(--err);color:#fff}
.btn:disabled{opacity:.5;cursor:not-allowed}.btn:disabled:hover{background:var(--bg2);filter:none}
.btn.go:disabled:hover{background:var(--green)}.btn.dg:disabled:hover{color:var(--err);background:var(--bg2);border-color:var(--bd)}
.mu{color:var(--mute)}
/* tab */
.tabs{display:flex;gap:4px;margin:0 0 20px;border-bottom:1px solid var(--bd)}
.tabs button{display:inline-flex;align-items:center;gap:8px;margin-bottom:-1px;padding:10px 14px;border:0;border-bottom:2px solid transparent;border-radius:6px 6px 0 0;background:transparent;color:var(--mute);cursor:pointer;transition:background .15s,color .15s}
.tabs button:hover{background:var(--hov);color:var(--fg)}
.tabs button:focus-visible{outline:2px solid var(--blue);outline-offset:-2px}
.tabs button[aria-selected=true]{color:var(--fg);font-weight:600;border-bottom-color:var(--accent)}
.cnt{min-width:20px;padding:0 6px;border-radius:2em;background:color-mix(in srgb,var(--mute) 22%,transparent);color:var(--fg);font-size:12px;font-weight:500;line-height:18px;text-align:center}
/* badge */
.bdg{display:inline-block;padding:0 10px;border:1px solid var(--bd);border-radius:2em;font-size:12px;font-weight:500;line-height:22px;white-space:nowrap;color:var(--mute)}
.bdg.ok{color:var(--ok);border-color:rgba(46,160,67,.5);background:rgba(46,160,67,.12)}
.bdg.er{color:var(--err);border-color:rgba(248,81,73,.5);background:rgba(248,81,73,.1)}
.bdg.wr{color:var(--warn);border-color:rgba(210,153,34,.55);background:rgba(210,153,34,.12)}
.pl{display:inline-block;padding:0 8px;border-radius:2em;background:color-mix(in srgb,var(--mute) 18%,transparent);color:var(--mute);font-size:12px;line-height:20px;white-space:nowrap}
/* kartu */
.cd{margin-bottom:16px;border:1px solid var(--bd);border-radius:6px;background:var(--bg);overflow:hidden}
.ch{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding:12px 16px;border-bottom:1px solid var(--bd);background:var(--bg2)}
.ct{font-size:15px;font-weight:600}
.cb{display:grid;gap:16px;padding:16px}
.ca{display:flex;gap:8px;flex-wrap:wrap;padding:12px 16px;border-top:1px solid var(--bd)}
.mg{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px 24px}
.mi small{display:block;margin-bottom:2px;color:var(--mute);font-size:12px}
.mi.w{grid-column:1/-1}
.ci{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border:1px solid color-mix(in srgb,var(--blue) 45%,transparent);border-radius:6px;background:color-mix(in srgb,var(--blue) 9%,var(--bg));font-size:13px}
.ci svg{margin-top:2px;color:var(--blue)}
/* lampiran */
.lm{padding:10px 12px;border:1px solid var(--bd);border-radius:6px;background:var(--bg2)}
.lh{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.lh .up{margin-left:auto}
.fl{display:grid;gap:6px;margin-top:8px}.fl.z{margin-top:0}
.fr{display:flex;align-items:center;gap:10px;min-width:0;padding:8px 10px;border:1px solid var(--bd);border-radius:6px;background:var(--bg);color:var(--fg);text-decoration:none;transition:border-color .15s,background .15s}
.fr:hover{border-color:var(--blue);background:var(--bg2)}
.fr:focus-visible{outline:2px solid var(--blue);outline-offset:1px}
.fr svg{width:18px;height:18px;flex:none;color:var(--blue)}.fr svg.pdf{color:var(--err)}
.fr .tx{flex:1;min-width:0}
.fr .n{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:13px;font-weight:600}
.fr:hover .n{color:var(--blue)}
.fr .s{display:block;color:var(--mute);font-size:12px}
.em{margin:8px 0 0;color:var(--mute);font-style:italic}
.emp2{padding:36px 16px;text-align:center;color:var(--mute);border:1px dashed var(--bd);border-radius:6px}
/* approval */
.ap{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.av{display:grid;place-items:center;width:28px;height:28px;flex:none;border-radius:50%;background:color-mix(in srgb,var(--blue) 18%,transparent);color:var(--blue);font-size:12px;font-weight:600}
.alr{padding:12px 16px 14px;border:1px solid var(--bd);border-radius:6px;background:var(--bg2)}
.alt{margin:0 0 12px;color:var(--mute);font-size:12px;font-weight:600;letter-spacing:.04em;text-transform:uppercase}
.stp{display:flex;align-items:flex-start}
.sp{display:flex;flex-direction:column;align-items:center;gap:6px;flex:none;width:92px;text-align:center;color:var(--mute);font-size:12px;line-height:1.3}
.sc{display:grid;place-items:center;width:28px;height:28px;border:2px solid var(--bd);border-radius:50%;background:var(--bg)}
.sc svg{width:14px;height:14px;stroke-width:2.2}
.sp.done .sc{border-color:var(--ok);background:var(--ok);color:#fff}
.sp.cur .sc{border-color:var(--warn);background:color-mix(in srgb,var(--warn) 16%,var(--bg));color:var(--warn)}
.sp.cur,.sp.done{color:var(--fg)}
.ln{flex:1;min-width:16px;height:2px;margin-top:13px;background:var(--bd)}
.ln.done{background:var(--ok)}
/* riwayat */
.box{border:1px solid var(--bd);border-radius:6px;background:var(--bg);overflow:hidden}
.rt{width:100%;border-collapse:collapse;table-layout:fixed}
.rt th{padding:10px 14px;border-bottom:1px solid var(--bd);background:var(--bg2);text-align:left;font-size:13px;font-weight:600;white-space:nowrap}
.rt td{padding:12px 14px;border-top:1px solid var(--bd);vertical-align:top;overflow-wrap:anywhere}
.rt tbody tr:first-child td{border-top:0}
.rt tbody tr:hover td{background:var(--bg2)}
.c2{width:130px}.c3{width:160px}.c4{width:170px}.c5{width:230px}.c7{width:140px}
.b{font-weight:600}.sm2{font-size:12.5px}
.ab{display:flex;flex-direction:column;max-width:100%}
.ab .btn{position:relative;width:100%;min-width:0;justify-content:flex-start;border-radius:0;white-space:nowrap}
.ab .btn+.btn{margin-top:-1px}
.ab .btn:first-child{border-radius:6px 6px 0 0}
.ab .btn:last-child{border-radius:0 0 6px 6px}
.ab .btn:hover:not(:disabled),.ab .btn:focus-visible{z-index:1}
.sd{margin-top:8px;font-size:13px}
.rj{margin-top:8px;padding:6px 10px;border-left:3px solid var(--err);border-radius:0 6px 6px 0;background:color-mix(in srgb,var(--err) 10%,var(--bg));color:var(--err);font-size:13px}
/* modal */
.dl{display:grid;grid-template-columns:110px 1fr;gap:10px 12px;margin:0 0 16px}
.dl dt{color:var(--mute)}.dl dd{margin:0;min-width:0;overflow-wrap:anywhere}
.lb{margin:0 0 4px;font-weight:600}
.fg{margin-bottom:14px}.fg>label{display:block;margin-bottom:6px;font-weight:600}
textarea.fld{min-height:110px;resize:vertical;line-height:1.5}
/* responsif: tabel jadi kartu */
@media (max-width:1180px){
  .rt thead{display:none}
  .rt,.rt tbody{display:block}
  .rt tr{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px 16px;padding:14px 16px;border-top:1px solid var(--bd)}
  .rt tr:first-child{border-top:0}
  .rt tbody tr:hover td{background:transparent}
  .rt td,.rt tbody tr:first-child td{display:block;padding:0;border:0;min-width:0}
  .rt td::before{content:attr(data-l);display:block;margin-bottom:2px;color:var(--mute);font-size:12px}
  .rt td.w{grid-column:1/-1}
  .rt .ab{flex-direction:row;width:100%}
  .rt .ab .btn{flex:1;height:36px;justify-content:center}
  .rt .ab .btn+.btn{margin-top:0;margin-left:-1px}
  .rt .ab .btn:first-child{border-radius:6px 0 0 6px}
  .rt .ab .btn:last-child{border-radius:0 6px 6px 0}
}
@media (max-width:640px){
  .pg{padding:16px 12px calc(40px + env(safe-area-inset-bottom,0px))}
  h1{font-size:22px}
  .tabs{gap:0}.tabs button{flex:1;justify-content:center;gap:6px;padding:10px 4px}
  .tabs button svg{display:none}
  .rt tr{grid-template-columns:repeat(2,minmax(0,1fr))}
  .rt td.s2{grid-column:1/-1}
  .rt .ab .btn{padding:0 4px;gap:4px;font-size:12px}
  .cb{padding:12px}.ch,.ca{padding:12px}
  .ca{display:grid;grid-template-columns:1fr 1fr}.ca .btn{height:38px}.ca .go{grid-column:1/-1;order:-1}
  .ca .btn:only-child{grid-column:1/-1}
  .sp{width:76px;font-size:11px}
  .dl{grid-template-columns:1fr;gap:2px}.dl dd{margin-bottom:10px}
}
/* ---- alert ---- */
.ov2{position:fixed;inset:0;z-index:90;display:flex;align-items:center;justify-content:center;padding:20px;background:rgba(1,4,9,.55);-webkit-backdrop-filter:blur(5px);backdrop-filter:blur(5px);animation:fade .22s ease-out both}
.ov2.out{animation:fadeo .17s ease-in forwards}
.dlg{position:relative;width:100%;max-width:400px;padding:32px 24px 22px;text-align:center;background:var(--bg);border:1px solid var(--bd);border-radius:12px;box-shadow:0 24px 64px rgba(1,4,9,.4);will-change:transform,opacity;animation:pop .38s cubic-bezier(.22,1,.36,1) both}
.dlg.shake{animation:pop .38s cubic-bezier(.22,1,.36,1) both,shake .5s .3s ease-in-out both}
.ov2.out .dlg{animation:outd .17s ease-in forwards}
.icw{position:relative;width:84px;height:84px;margin:0 auto 18px}
.icw::after{content:"";position:absolute;inset:0;border:2px solid currentColor;border-radius:50%;opacity:0;animation:ripple .85s .32s cubic-bezier(.2,.6,.3,1) both}
.icw.ok{color:var(--ok)}.icw.er{color:var(--err)}.icw.q{color:var(--blue)}
.ic{position:relative;width:84px;height:84px;overflow:visible}
.ic *{fill:none;stroke:currentColor;stroke-linecap:round;stroke-linejoin:round}
.ic .bg{fill:currentColor;stroke:none;opacity:.12;transform-origin:42px 42px;animation:grow .4s .04s cubic-bezier(.22,1,.36,1) both}
.ic .rg{stroke-width:4;stroke-dasharray:240;stroke-dashoffset:240;transform:rotate(-90deg);transform-origin:42px 42px;animation:draw .5s .06s cubic-bezier(.45,0,.2,1) forwards}
.ic .ck{stroke-width:5;stroke-dasharray:50;stroke-dashoffset:50;animation:draw .3s .38s cubic-bezier(.45,0,.2,1) forwards}
.ic .x1{stroke-width:5;stroke-dasharray:36;stroke-dashoffset:36;animation:draw .22s .38s cubic-bezier(.45,0,.2,1) forwards}
.ic .x2{stroke-width:5;stroke-dasharray:36;stroke-dashoffset:36;animation:draw .22s .5s cubic-bezier(.45,0,.2,1) forwards}
.ic .tri{stroke-width:4;stroke-dasharray:200;stroke-dashoffset:200;animation:draw .5s .06s cubic-bezier(.45,0,.2,1) forwards}
.ic .qm{stroke-width:5;opacity:0;animation:fade .25s .3s ease-out both}
.icw.q .ic{animation:wob .45s .04s cubic-bezier(.22,1,.36,1) both}
.t{margin:0 0 6px;font-size:20px;font-weight:600;line-height:1.3;animation:up .4s .14s cubic-bezier(.22,1,.36,1) both}
.m{margin:0 0 22px;color:var(--mute);animation:up .4s .19s cubic-bezier(.22,1,.36,1) both}
.f{display:flex;justify-content:center;gap:8px;animation:up .4s .24s cubic-bezier(.22,1,.36,1) both}
.bar{position:absolute;left:0;bottom:0;height:3px;width:100%;background:var(--ok);opacity:.8;border-radius:0 0 0 12px;transform-origin:left;animation:bar var(--ms) linear both}
.cf{position:absolute;left:50%;top:50%;width:var(--s);height:var(--s);background:var(--c);border-radius:var(--rd);opacity:0;pointer-events:none;will-change:transform,opacity;animation:burst 1.1s var(--d) cubic-bezier(.1,.7,.25,1) both}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes fadeo{to{opacity:0}}
@keyframes pop{from{opacity:0;transform:translate3d(0,14px,0) scale(.95)}to{opacity:1;transform:none}}
@keyframes outd{to{opacity:0;transform:translate3d(0,4px,0) scale(.97)}}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes grow{from{transform:scale(.5);opacity:0}to{transform:scale(1);opacity:.12}}
@keyframes ripple{from{opacity:.35;transform:scale(1)}to{opacity:0;transform:scale(1.5)}}
@keyframes up{from{opacity:0;transform:translate3d(0,6px,0)}to{opacity:1;transform:none}}
@keyframes shake{0%,100%{translate:0}20%{translate:-6px}40%{translate:5px}60%{translate:-3px}80%{translate:1.5px}}
@keyframes wob{from{transform:scale(.7) rotate(-10deg);opacity:0}to{transform:none;opacity:1}}
@keyframes bar{to{transform:scaleX(0)}}
@keyframes burst{0%{opacity:0;transform:translate(-50%,-50%) scale(.3)}8%{opacity:1}60%{opacity:1}100%{opacity:0;transform:translate(calc(-50% + var(--dx)),calc(-50% + var(--dy) + 55px)) rotate(var(--r)) scale(1)}}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;animation-delay:0s!important}.cf{display:none}}
</style>
</head>
<body>
<div class="pg">
  <h1>Permohonan Saya</h1>
  <p class="ds">Status dan riwayat permohonan</p>

  <div class="tabs" role="tablist" aria-label="Status permohonan">
    <button type="button" role="tab" id="t-draft" data-tab="draft" aria-selected="true" aria-controls="p-draft"><svg class="i" viewBox="0 0 16 16"><path d="M9 2.5H3.5v10h10V7M11 2.5L13.5 5 8 10.5H5.5V8z"/></svg>Draft <span class="cnt" id="c-draft">0</span></button>
    <button type="button" role="tab" id="t-menunggu" data-tab="menunggu" aria-selected="false" aria-controls="p-menunggu" tabindex="-1"><svg class="i" viewBox="0 0 16 16"><circle cx="8" cy="8" r="6.5"/><path d="M8 4.5V8l2.5 1.5"/></svg>Menunggu <span class="cnt" id="c-menunggu">0</span></button>
    <button type="button" role="tab" id="t-riwayat" data-tab="riwayat" aria-selected="false" aria-controls="p-riwayat" tabindex="-1"><svg class="i" viewBox="0 0 16 16"><path d="M2.5 8a5.5 5.5 0 105.5-5.5A5.5 5.5 0 004 4.2M2.5 2.5v2.2h2.2M8 5v3l2 1.2"/></svg>Riwayat <span class="cnt" id="c-riwayat">0</span></button>
  </div>

  <div id="p-draft" role="tabpanel" aria-labelledby="t-draft"></div>
  <div id="p-menunggu" role="tabpanel" aria-labelledby="t-menunggu" hidden></div>
  <div id="p-riwayat" role="tabpanel" aria-labelledby="t-riwayat" hidden></div>
</div>
<input type="file" id="fin" accept=".pdf,.jpg,.jpeg,.png,application/pdf,image/jpeg,image/png" multiple hidden>
<script>
window.Alert=(function(){
  var SVG={
    ok:'<circle class="bg" cx="42" cy="42" r="38"/><circle class="rg" cx="42" cy="42" r="38"/><path class="ck" d="M26 43l11 11 21-23"/>',
    er:'<circle class="bg" cx="42" cy="42" r="38"/><circle class="rg" cx="42" cy="42" r="38"/><path class="x1" d="M31 31l22 22"/><path class="x2" d="M53 31L31 53"/>',
    q:'<circle class="bg" cx="42" cy="42" r="38"/><circle class="rg" cx="42" cy="42" r="38"/><path class="qm" d="M33.5 34a8.5 8.5 0 1112 7.7c-2.4 1.1-3.5 2.6-3.5 5.3M42 56v.01"/>',
    lo:'<circle class="bg" cx="42" cy="42" r="38"/><circle class="rg" cx="42" cy="42" r="38"/><path class="qm" d="M37 29h-6a3 3 0 00-3 3v20a3 3 0 003 3h6M40 42h19M52 34.5l7.5 7.5-7.5 7.5"/>',
    w:'<path class="tri" d="M42 12L77 71H7z"/><path class="qm" d="M42 33v17M42 60v.01"/>'
  };
  var COL=["#2da44e","#0969da","#8250df","#d4a72c","#bf3989","#fb8500"];
  function esc(v){return String(v==null?"":v).replace(/&/g,"&amp;").replace(/</g,"&lt;")}
  function confetti(box){
    for(var i=0;i<26;i++){
      var a=Math.random()*Math.PI*2,d=60+Math.random()*100,s=6+Math.random()*5,e=document.createElement("i");
      e.className="cf";
      e.style.cssText="--dx:"+Math.cos(a)*d+"px;--dy:"+(Math.sin(a)*d-20)+"px;--r:"+(360+Math.random()*540)+"deg;--s:"+s+"px;--c:"+COL[i%COL.length]+";--d:"+(.3+Math.random()*.12)+"s;--rd:"+(Math.random()<.4?"50%":"2px");
      box.appendChild(e);
    }
  }
  function show(o){
    return new Promise(function(done){
      var prev=document.activeElement,ov=document.createElement("div"),kind=o.kind,icon=o.icon||(kind==="q"&&o.danger?'w':kind),
          cls=(kind==="q"&&o.danger)?"er":kind;
      ov.className="ov2";
      ov.innerHTML='<div class="dlg'+(kind==="er"?' shake':'')+'" role="alertdialog" aria-modal="true" aria-labelledby="ad-t" aria-describedby="ad-m"'+(o.ms?' style="--ms:'+o.ms+'ms"':'')+'>'+
        '<div class="icw '+cls+'"><svg class="ic" viewBox="0 0 84 84" aria-hidden="true">'+SVG[icon]+'</svg></div>'+
        '<h2 class="t" id="ad-t">'+esc(o.title)+'</h2><p class="m" id="ad-m">'+esc(o.message)+'</p>'+
        '<div class="f">'+o.buttons+'</div>'+(o.ms?'<div class="bar"></div>':'')+'</div>';
      document.body.appendChild(ov);document.body.style.overflow="hidden";
      var dlg=ov.firstChild,first=ov.querySelector("[data-f]")||ov.querySelector("[data-r]"),timer,left=o.ms,t0;
      if(kind==="ok")confetti(ov.querySelector(".icw"));
      first.focus();
