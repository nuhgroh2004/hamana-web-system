<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Masuk · Hamana Works Indonesia</title>
<style>
:root{--bg:#fff;--fg:#111;--mute:#b5b5b5;--mute2:#8c8c8c;--bd:#dcdcdc;--pill:#f1f1f1;--btn:#111;--btnfg:#fff;--err:#cf222e;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0d0d0e;--fg:#f5f5f5;--mute:#5f5f64;--mute2:#8d8d93;--bd:#3a3a3d;--pill:#1c1c1e;--btn:#f5f5f5;--btnfg:#111;--err:#ff7b72;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0d0d0e;--fg:#f5f5f5;--mute:#5f5f64;--mute2:#8d8d93;--bd:#3a3a3d;--pill:#1c1c1e;--btn:#f5f5f5;--btnfg:#111;--err:#ff7b72;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.5 -apple-system,"Segoe UI",Inter,Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}
.wrap{max-width:1360px;margin:0 auto;padding:0 clamp(20px,6vw,96px)}
header{position:relative;display:flex;align-items:center;justify-content:center;height:72px}
.brand{position:absolute;left:0;top:50%;transform:translateY(-50%);display:flex;align-items:center;gap:10px;color:var(--fg);text-decoration:none;font-weight:600}
.brand svg{width:20px;height:20px;fill:currentColor}
.pill{display:flex;gap:4px;padding:6px;border-radius:999px;background:var(--pill)}
.pill a{padding:6px 14px;border-radius:999px;color:var(--fg);font-size:12.5px;text-decoration:none;opacity:.8;transition:background .2s,opacity .2s}
.pill a:hover{opacity:1;background:rgba(127,127,127,.15)}
main.grid{display:grid;grid-template-columns:minmax(300px,400px) minmax(0,1fr);gap:clamp(32px,5vw,72px);align-items:center;min-height:calc(100dvh - 72px - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px));padding-bottom:32px}
h1{margin:0 0 36px;font-size:clamp(28px,3.1vw,40px);line-height:1.12;font-weight:600;letter-spacing:-.025em}
h1 span{display:block;color:#004098}
.fld{width:100%;height:50px;padding:0 20px;border:1px solid var(--bd);border-radius:999px;background:var(--bg);color:var(--fg);font:inherit;outline:0;transition:border-color .2s,box-shadow .2s}
.fld:focus{border-color:var(--fg);box-shadow:0 0 0 3px rgba(127,127,127,.18)}
.fld.bad{border-color:var(--err)}
.go{width:100%;height:50px;margin-top:12px;border:0;border-radius:999px;background:#004098;color:#fff;font:inherit;font-weight:600;cursor:pointer;transition:opacity .2s,transform .1s}
.go:hover{opacity:.88}.go:active{transform:scale(.99)}.go:disabled{opacity:.6;cursor:default}
.row{margin-bottom:14px}
.lbl{display:block;margin:0 0 6px 4px;font-size:13px;font-weight:500}
.err{min-height:20px;margin:8px 4px 0;color:var(--err);font-size:12.5px}
[hidden]{display:none!important}
/* ===== panel gelap + mockup laptop ===== */
.hero{position:relative;height:clamp(440px,calc(100dvh - 150px),640px);border-radius:20px;overflow:hidden;background:radial-gradient(120% 90% at 70% 0,#1d1d20,#0c0c0d 70%);border:1px solid #232326}
.lap{position:absolute;left:6%;top:14%;width:680px;transform-origin:0 0;transform:perspective(1800px) rotateX(10deg) rotateY(-14deg) rotateZ(5deg)}
.bez{padding:12px;border-radius:20px;background:#2a2a2d;box-shadow:0 40px 80px rgba(0,0,0,.6)}
.scr{position:relative;display:flex;height:400px;border-radius:10px;background:#19191b;overflow:hidden}
.scr::before{content:"";position:absolute;top:0;left:50%;width:70px;height:10px;transform:translateX(-50%);border-radius:0 0 8px 8px;background:#2a2a2d;z-index:2}
.sb{width:130px;padding:14px 10px;border-right:1px solid #262628;color:#8a8a90;font-size:8px}
.sb i{display:block;height:7px;margin:11px 0;border-radius:4px;background:#2c2c2f}
.sb i:nth-child(2){background:#3b3b3f}.sb p{margin:0 0 14px;color:#cfcfd3;font-weight:600}
.ct{flex:1;min-width:0;padding:34px 22px}
.ct h3{margin:0;color:#f2f2f4;font-size:16px;font-weight:600}.ct h3+p{margin:2px 0 18px;color:#6d6d73;font-size:15px}
.cards{display:flex;gap:14px}
.cd{flex:none;width:150px;height:200px;padding:14px;border-radius:16px;font-size:10.5px;line-height:1.35;color:#eee}
.cd small{display:block;margin-top:70px;font-size:7px;color:#ffffff88}
.c1{background:linear-gradient(160deg,#5d4838,#3b2e24)}
.c2{background:#2c2c2f}.c3{background:linear-gradient(160deg,#3d4146,#2c2f33)}
.av{display:block;width:56px;height:70px;margin:14px auto 0;border-radius:10px}
.a1{background:radial-gradient(circle at 50% 32%,#e0b392 0 22%,transparent 23%),linear-gradient(#2b211b 0 34%,#7a4f3a 34%)}
.a3{background:radial-gradient(circle at 50% 32%,#efc9ae 0 22%,transparent 23%),linear-gradient(#222 0 34%,#8d9aa6 34%)}
.tile{display:grid;place-items:center;height:62px;margin-top:16px;border-radius:6px;background:#1f9a5b;color:#fff;font-weight:700;font-size:11px;text-align:center;line-height:1.1}
.base{height:14px;margin:0 -30px;border-radius:0 0 40px 40px;background:linear-gradient(#3a3a3d,#1c1c1e)}
@media (max-width:900px){
  .hero{display:none}
  main.grid{grid-template-columns:1fr;align-items:start;padding-top:24px}
  .pill{max-width:100%;overflow-x:auto;scrollbar-width:none}.pill a{white-space:nowrap}
}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <a class="brand" href="#" aria-label="HWI"><svg viewBox="0 0 20 20"><circle cx="10" cy="3.5" r="3"/><circle cx="3.5" cy="10" r="3"/><circle cx="16.5" cy="10" r="3"/><circle cx="10" cy="16.5" r="3"/></svg></a>
    <nav class="pill" aria-label="Navigasi"><a href="#">Privasi dan ketentuan</a><a href="#">FAQ</a></nav>
  </header>

  <main class="grid">
    <section>
      <h1>Selamat datang di <span>Hamana Works Indonesia</span></h1>

      <form id="f" novalidate>
        <div class="row"><label class="lbl" for="email">Email</label><input class="fld" id="email" type="email" autocomplete="email" placeholder="email@gmail.com"></div>
        <div class="row"><label class="lbl" for="pw">Password</label><input class="fld" id="pw" type="password" autocomplete="current-password" placeholder="Masukkan password"></div>
        <div class="err" id="err" role="alert" aria-live="polite"></div>
        <button class="go" id="go" type="submit">Login</button>
      </form>
    </section>

    <aside class="hero" aria-hidden="true">
      <div class="lap">
        <div class="bez"><div class="scr">
          <div class="sb"><p>Ruang kerja HWI</p><i></i><i></i><i></i><i></i><i></i><i></i><i style="margin-top:28px"></i><i></i><i></i></div>
          <div class="ct">
            <h3>Halo, Nuhgroh</h3><p>Ada yang bisa dibantu hari ini?</p>
            <div class="cards">
              <div class="cd c1">Ajukan cuti tahunan Anda<span class="av a1"></span></div>
              <div class="cd c2">Lihat slip gaji bulan ini<div class="tile">SLIP GAJI<br>OKT 2026</div><small>Payroll · Slip Gaji</small></div>
              <div class="cd c3">Rekap kehadiran bulan ini<span class="av a3"></span></div>
            </div>
          </div>
        </div></div>
        <div class="base"></div>
      </div>
    </aside>
  </main>
</div>

<script>
(function(){
  var f=document.getElementById("f"),email=document.getElementById("email"),pw=document.getElementById("pw"),
      err=document.getElementById("err"),go=document.getElementById("go");
  function bad(el,msg){err.textContent=msg;el.classList.add("bad");el.focus()}
  function clear(){err.textContent="";email.classList.remove("bad");pw.classList.remove("bad")}
  email.addEventListener("input",clear);pw.addEventListener("input",clear);
  f.addEventListener("submit",function(e){
    e.preventDefault();clear();
    var v=email.value.trim();
    if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v)){bad(email,"Masukkan alamat email yang valid.");return}
    if(pw.value.length<6){bad(pw,"Password minimal 6 karakter.");return}
    go.disabled=true;go.textContent="Memproses…";
    setTimeout(function(){
      go.textContent="Berhasil masuk ✓";
      // Hubungkan ke backend Anda di sini:
      document.dispatchEvent(new CustomEvent("login",{detail:{email:v}}));
      setTimeout(function(){go.disabled=false;go.textContent="Login"},1500);
    },900);
  });
})();
</script>
</body>
</html>
